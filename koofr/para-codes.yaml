# LoveCloud six-digit PARA codes for Koofr.
# Canonical: shannonjlove/LoveCloud-Canonical-Manual (BookStack book 34)
#            and shannonjlove/craft-repo PARA-SYSTEM.md
#
# Pattern for roots:  [PPPPPP]_[ROOT]__[surface]
# Pattern for children: [PPPPPP]_[semantic]
# Five-digit v8.1 codes (01001, 10001, 50003, …) stay as historical aliases.

schema_version: 1
authority: LoveCloud v10.3 / v10.3.1
filename_contract: "[PARA]_[DATE]__[DOCID]__[TITLE]__[VERSION]__[SHA8].[EXT]"

roots:
  - code: "010000"
    name: INBOX
    purpose: Unprocessed captures awaiting classification
  - code: "020000"
    name: PROJECTS
    purpose: Active outcome-driven work
  - code: "030000"
    name: AREAS
    purpose: Ongoing responsibilities
  - code: "040000"
    name: RESOURCES
    purpose: Reference, templates, knowledge
  - code: "050000"
    name: ARCHIVES
    purpose: Completed, superseded, historical
  - code: "060000"
    name: PRIVATE-MEDIA
    purpose: Sensitive, personal, NSFW, access-controlled
  - code: "070000"
    name: SYSTEM-AUTOMATION
    purpose: Scripts, infrastructure, MCP, deployment
  - code: "080000"
    name: APPLICATION-DATA
    purpose: App-managed state, databases, caches
  - code: "090000"
    name: QUARANTINE
    purpose: Untrusted, malformed, policy-blocked

# Top-level Koofr directory remaps. Server-side DirMove only.
top_level:
  koofr_para:
    "@INBOX_koofr": "010000_INBOX__koofr"
    "@PROJECTS_koofr": "020000_PROJECTS__koofr"
    "@AREAS_koofr": "030000_AREAS__koofr"
    "@RESOURCES_koofr": "040000_RESOURCES__koofr"
    "@ARCHIVES_koofr": "050000_ARCHIVES__koofr"
    "_SYSTEM": "070000_SYSTEM-AUTOMATION__koofr"
  idrive_e2_projections:
    inbox-idrive-e2: "010000_INBOX__idrive-e2"
    projects-idrive-e2: "020000_PROJECTS__idrive-e2"
    areas-idrive-e2: "030000_AREAS__idrive-e2"
    resources-idrive-e2: "040000_RESOURCES__idrive-e2"
    archives-idrive-e2: "050000_ARCHIVES__idrive-e2"
    private-idrive-e2: "060000_PRIVATE-MEDIA__idrive-e2"
    shannon-photos-e2: "060010_PHOTOS__idrive-e2"
    video-media-e2: "060020_VIDEO-MEDIA__idrive-e2"
    graphics-media-e2: "060030_GRAPHICS__idrive-e2"
    agent-data-e2: "070010_AGENT-DATA__idrive-e2"
    assets-e2: "070020_ASSETS__idrive-e2"
    stacks-backups-e2: "070030_STACKS-BACKUPS__idrive-e2"
    n8n-backups-e2: "080010_N8N-BACKUPS__idrive-e2"
    bookstack-data-e2: "080020_BOOKSTACK__idrive-e2"
    paperless-docs-e2: "080030_PAPERLESS__idrive-e2"
    quarantine-e2: "090000_QUARANTINE__idrive-e2"
  nest:
    Stash: "060000_PRIVATE-MEDIA__koofr/Stash"

create_roots:
  - "060000_PRIVATE-MEDIA__koofr"
  - "080000_APPLICATION-DATA__koofr"
  - "090000_QUARANTINE__koofr"

# Canonical children seeded under the Koofr PARA roots (mkdir only).
seed_children:
  "010000_INBOX__koofr":
    - "010001_uploads"
    - "010002_processing"
    - "010003_stabilization"
    - "010004_review"
    - "hazel-ready"
  "020000_PROJECTS__koofr":
    - "020001_web-projects"
    - "020002_media-productions"
    - "020003_dev-projects"
    - "020004_content-projects"
  "030000_AREAS__koofr":
    - "030001_infrastructure-and-ops"
    - "030002_content-and-media"
    - "030003_personal-development"
    - "030004_editing-and-graphics"
    - "030005_learning-and-tutorials"
  "040000_RESOURCES__koofr":
    - "040001_reference-materials"
    - "040002_tools-and-software"
    - "040003_design-resources"
    - "040004_entertainment"
  "050000_ARCHIVES__koofr":
    - "050001_video-project-archives"
    - "050002_project-archives"
    - "050003_document-archives"
  "060000_PRIVATE-MEDIA__koofr":
    - "060001_credentials"
    - "060002_personal-docs"
    - "060003_server-configs"
    - "060004_legal"
    - "060010_photos"
    - "060020_video-media"
    - "060030_graphics"
  "070000_SYSTEM-AUTOMATION__koofr":
    - "070010_agent-data"
    - "070020_assets"
    - "070030_stacks-backups"
  "080000_APPLICATION-DATA__koofr":
    - "080010_n8n"
    - "080020_bookstack"
    - "080030_paperless"
  "090000_QUARANTINE__koofr":
    - "090001_conflicts"
    - "090002_failures"
    - "090003_unsupported"
    - "090004_remediation"

leave_unnumbered:
  - "My desktop sync"
  - "My documents"
  - "My pictures"
  - "My videos"

stash_library_path: "060000_PRIVATE-MEDIA__koofr/Stash/media"
