# Stash Docker Compose with 1Password Integration
#
# This example shows how to integrate 1Password with Stash using Docker Compose
#
# Setup:
# 1. Create 1Password vault "Stash Deployment"
# 2. Add credentials items to vault
# 3. Run: eval $(op signin) && docker compose up -d

version: '3.8'

# Services
services:
  # 1Password Connect Server (optional - for API-based secret retrieval)
  # Uncomment to use Connect server instead of CLI
  #
  # connect:
  #   image: 1password/connect-api:latest
  #   container_name: 1password-connect
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro
  #   environment:
  #     - OP_CONNECT_TOKEN=${OP_CONNECT_TOKEN}
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Stash Service
  stash:
    image: stashapp/stash:latest
    container_name: stash
    restart: unless-stopped
    ports:
      - "${STASH_PORT:-9999}:9999"

    # Environment variables from 1Password
    # Note: These should be set before 'docker compose up'
    # Run: eval $(op signin) && export STASH_DB_PASS=$(op read ...) && docker compose up
    environment:
      # Stash Core Configuration
      - STASH_STASH=/data/
      - STASH_GENERATED=/generated/
      - STASH_METADATA=/metadata/
      - STASH_CACHE=/cache/
      - STASH_PORT=9999
      - TZ=Etc/UTC

      # Database Credentials (from 1Password)
      # Set via: export STASH_DB_USER=$(op read op://Vault/Item/username)
      - STASH_DB_USER=${STASH_DB_USER:-}
      - STASH_DB_PASSWORD=${STASH_DB_PASSWORD:-}
      - STASH_DB_HOST=${STASH_DB_HOST:-localhost}
      - STASH_DB_NAME=${STASH_DB_NAME:-stash}

      # API Keys (from 1Password)
      # Set via: export STASH_SCRAPER_API_KEY=$(op read op://Vault/Item/key)
      - STASH_SCRAPER_API_KEY=${STASH_SCRAPER_API_KEY:-}

      # Security (from 1Password)
      # Set via: export STASH_SESSION_SECRET=$(op read op://Vault/Item/secret)
      - STASH_SESSION_SECRET=${STASH_SESSION_SECRET:-}

      # Logging
      - LOG_LEVEL=info

    volumes:
      # Config with credentials (1Password-managed)
      - ./config:/root/.stash:rw
      - ./data:/data:rw
      - ./metadata:/metadata:rw
      - ./cache:/cache:rw
      - ./blobs:/blobs:rw
      - ./generated:/generated:rw

    # Uncomment to use 1Password Connect server
    # depends_on:
    #   - connect
    # networks:
    #   - 1password

    logging:
      driver: "json-file"
      options:
        max-file: "10"
        max-size: "2m"

# Uncomment to use 1Password Connect
# networks:
#   1password:
#     driver: bridge

# Example secrets for quick reference
#
# Before running, ensure these 1Password items exist:
#
# Item: Stash Database
#   - username: stash_user
#   - password: strong_password
#
# Item: Stash Scrapers API
#   - api_key: your_api_key
#
# Item: Stash Session
#   - secret: your_session_secret
#
# Then export before compose up:
#
#   eval $(op signin)
#   export STASH_DB_USER=$(op read op://Stash Deployment/Stash Database/username)
#   export STASH_DB_PASSWORD=$(op read op://Stash Deployment/Stash Database/password)
#   export STASH_SCRAPER_API_KEY=$(op read op://Stash Deployment/Stash Scrapers API/api_key)
#   export STASH_SESSION_SECRET=$(op read op://Stash Deployment/Stash Session/secret)
#   docker compose up -d
